name: DevSecOps Pipeline

on:
  push:
    branches: [ main ]

env:
  IMAGE: ghcr.io/${{ github.repository }}/calculator:${{ github.sha }}

jobs:
  build-test:
    name: Build & Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r app/requirements.txt
      - name: Unit tests
        run: pytest app/tests/ -v

  sast:
    name: SAST (Bandit)
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - run: pip install bandit
      - name: Static code analysis
        run: bandit -r app/ -ll          # scan source code for insecure patterns

  sca:
    name: SCA (pip-audit)
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - run: pip install pip-audit
      - name: Dependency vulnerability scan
        run: pip-audit -r app/requirements.txt

  secret-scan:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Scan for hardcoded secrets
        uses: gitleaks/gitleaks-action@v2

  image-scan:
    name: Container Image Scan + Security Gate (Trivy)
    runs-on: ubuntu-latest
    needs: [ sast, sca, secret-scan ]
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t $IMAGE ./app
      - name: Trivy scan (fail on HIGH/CRITICAL)   # <-- security gate
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.IMAGE }}
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image (only if gate passed)
        run: docker push $IMAGE

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: image-scan
    steps:
      - uses: actions/checkout@v4
      - name: Deploy manifests
        run: |
          echo "kubectl apply -f k8s/"
          echo "kubectl set image deployment/calculator calculator=$IMAGE"
