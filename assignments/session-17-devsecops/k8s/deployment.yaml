apiVersion: apps/v1
kind: Deployment
metadata:
  name: calculator
  labels: { app: calculator }
spec:
  replicas: 2
  selector:
    matchLabels: { app: calculator }
  template:
    metadata:
      labels: { app: calculator }
    spec:
      containers:
        - name: calculator
          image: ghcr.io/pulasari-jai/devsecops-calculator:latest
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet: { path: /health, port: 5000 }
            initialDelaySeconds: 3
