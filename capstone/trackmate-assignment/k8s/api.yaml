apiVersion: apps/v1
kind: Deployment
metadata:
  name: trackmate-api
  namespace: trackmate
  labels:
    app: trackmate-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: trackmate-api
  template:
    metadata:
      labels:
        app: trackmate-api
    spec:
      containers:
        - name: api
          image: trackmate-api:local      # load into kind/minikube, or set a registry image
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: trackmate-config
                  key: POSTGRES_USER
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: trackmate-config
                  key: POSTGRES_DB
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trackmate-secret
                  key: POSTGRES_PASSWORD
            # k8s substitutes $(VAR) from env vars defined above in this container.
            - name: DATABASE_URL
              value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@trackmate-db:5432/$(POSTGRES_DB)
            - name: APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trackmate-secret
                  key: APP_PASSWORD
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: trackmate-secret
                  key: SECRET_KEY
            - name: TOKEN_HOURS
              valueFrom:
                configMapKeyRef:
                  name: trackmate-config
                  key: TOKEN_HOURS
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: trackmate-api
  namespace: trackmate
spec:
  selector:
    app: trackmate-api
  ports:
    - port: 8000
      targetPort: 8000
