# DEMO secret — change every value before any real deployment.
# stringData lets you write plaintext; Kubernetes base64-encodes it on apply.
apiVersion: v1
kind: Secret
metadata:
  name: trackmate-secret
  namespace: trackmate
type: Opaque
stringData:
  APP_PASSWORD: "trackmate"
  SECRET_KEY: "please-change-this-to-a-long-random-string"
  POSTGRES_PASSWORD: "trackmate"
