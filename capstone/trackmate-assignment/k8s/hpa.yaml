# Autoscale the API on CPU. Requires metrics-server in the cluster
# (minikube addons enable metrics-server).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: trackmate-api
  namespace: trackmate
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: trackmate-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
