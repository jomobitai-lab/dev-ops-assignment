# TrackMate — full local stack: Postgres + API + frontend (nginx).
# Usage:
#   cp .env.example .env
#   docker compose up --build
#   open http://localhost:8080
name: trackmate

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trackmate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trackmate}
      POSTGRES_DB: ${POSTGRES_DB:-trackmate}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trackmate} -d ${POSTGRES_DB:-trackmate}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Uncomment to inspect the DB from the host (e.g. with psql / a GUI):
    # ports: ["5432:5432"]

  api:
    build:
      context: ./api
    image: trackmate-api:local
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-trackmate}:${POSTGRES_PASSWORD:-trackmate}@db:5432/${POSTGRES_DB:-trackmate}
      APP_PASSWORD: ${APP_PASSWORD:-trackmate}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      TOKEN_HOURS: ${TOKEN_HOURS:-720}
    depends_on:
      db:
        condition: service_healthy
    # Uncomment to hit the API directly (bypassing the frontend proxy):
    # ports: ["8000:8000"]

  frontend:
    build:
      context: ./frontend
    image: trackmate-frontend:local
    restart: unless-stopped
    environment:
      BACKEND_URL: http://api:8000
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  pgdata:
