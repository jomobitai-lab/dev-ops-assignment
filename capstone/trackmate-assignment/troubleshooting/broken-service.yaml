# Troubleshooting lab: this Service's selector matches no Pods, so it has no
# endpoints and sends traffic nowhere.
#
#   kubectl apply -f troubleshooting/broken-service.yaml -n trackmate
#   kubectl get svc broken-service -n trackmate
#   kubectl get endpoints broken-service -n trackmate     # ENDPOINTS: <none>
#   kubectl get pods -n trackmate --show-labels
#
# Lesson: a Service selects Pods by label. Wrong label = no endpoints = no traffic.
# Fix: change the selector to match a real Pod label (e.g. app: trackmate-backend).
apiVersion: v1
kind: Service
metadata:
  name: broken-service
spec:
  selector:
    app: no-such-app
  ports:
    - port: 8000
      targetPort: 8000
