# TrackMate CI/CD pipeline.
#
# NOTE: GitHub only runs workflows found in `.github/workflows/` at the REPO
# ROOT. This file lives inside the project folder as the assignment deliverable;
# to activate it on GitHub, copy it to the repository root:
#   cp capstone/trackmate-assignment/.github/workflows/ci-cd.yml .github/workflows/
#
# Pipeline: test the API -> build the frontend -> build & push both images to
# GHCR (push only on branch pushes, not pull requests).
name: TrackMate CI/CD

on:
  push:
    branches: [main, "claude/**"]
    paths: ["capstone/trackmate-assignment/**"]
  pull_request:
    paths: ["capstone/trackmate-assignment/**"]
  workflow_dispatch:

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}/trackmate

jobs:
  backend-test:
    name: API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: capstone/trackmate-assignment/api/requirements-dev.txt
      - name: Install dependencies
        working-directory: capstone/trackmate-assignment/api
        run: pip install -r requirements-dev.txt
      - name: Run tests
        working-directory: capstone/trackmate-assignment/api
        run: pytest -q

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: capstone/trackmate-assignment/frontend/package-lock.json
      - name: Install dependencies
        working-directory: capstone/trackmate-assignment/frontend
        run: npm ci
      - name: Build
        working-directory: capstone/trackmate-assignment/frontend
        run: npm run build

  docker:
    name: Build & push images
    needs: [backend-test, frontend-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: capstone/trackmate-assignment/api
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-api:latest
            ${{ env.IMAGE_PREFIX }}-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: capstone/trackmate-assignment/frontend
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-frontend:latest
            ${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
