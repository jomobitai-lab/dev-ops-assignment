# TrackMate CI/CD pipeline.
#   test  ->  build + Trivy scan + push to GHCR  ->  deploy with Helm
#
# This workflow assumes the project is the repository root (i.e. you push the
# trackmate-assignment folder as its own repo). GitHub only runs workflows found
# at <repo-root>/.github/workflows/.
name: TrackMate CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (pytest + frontend build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Run backend tests
        working-directory: backend
        run: pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

  build-scan-push:
    name: Build, scan, push
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/trackmate-backend
      FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/trackmate-frontend
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build images (tagged with the commit SHA)
        run: |
          docker build -t $BACKEND_IMAGE:${{ github.sha }} ./backend
          docker build -t $FRONTEND_IMAGE:${{ github.sha }} ./frontend
      - name: Trivy scan — backend
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Trivy scan — frontend
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Push images
        if: github.event_name != 'pull_request'
        run: |
          docker push $BACKEND_IMAGE:${{ github.sha }}
          docker push $FRONTEND_IMAGE:${{ github.sha }}

  deploy:
    name: Deploy with Helm
    if: github.ref == 'refs/heads/main'
    needs: build-scan-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Configure kubectl
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG_DATA" | base64 -d > ~/.kube/config
      - name: Helm upgrade --install
        run: |
          helm upgrade --install trackmate ./helm/trackmate \
            -n trackmate --create-namespace \
            --set backend.image=ghcr.io/${{ github.repository_owner }}/trackmate-backend \
            --set backend.tag=${{ github.sha }} \
            --set frontend.image=ghcr.io/${{ github.repository_owner }}/trackmate-frontend \
            --set frontend.tag=${{ github.sha }}
