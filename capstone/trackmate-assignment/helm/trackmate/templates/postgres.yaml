apiVersion: v1
kind: Secret
metadata:
  name: trackmate-postgres
  labels:
    {{- include "trackmate.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.postgres.username | quote }}
  password: {{ .Values.postgres.password | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: trackmate-postgres
  labels:
    {{- include "trackmate.labels" . | nindent 4 }}
spec:
  selector:
    app: trackmate-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trackmate-postgres
  labels:
    {{- include "trackmate.labels" . | nindent 4 }}
    app: trackmate-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trackmate-postgres
  template:
    metadata:
      labels:
        app: trackmate-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: trackmate-postgres
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trackmate-postgres
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: trackmate-postgres-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: trackmate-postgres-data
  labels:
    {{- include "trackmate.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.postgres.storage }}
